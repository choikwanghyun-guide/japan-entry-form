<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>샌딩백 조편성</title>
<!-- rev_2026_1110_2142 (KST) 샌딩백 조편성 웹앱 — 첫 버전 (GitHub Pages 업로드) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#dcdad4; --accent:#1f5fbf; --warn:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, "맑은 고딕", sans-serif; font-size:16px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .hint { color:var(--muted); font-size:13px; margin: 6px 0 0; line-height:1.5; }
  textarea { width:100%; min-height:130px; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  button { font-size:15px; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  table { width:100%; border-collapse:collapse; }
  th { font-size:13px; color:var(--muted); font-weight:500; text-align:left; padding:4px; }
  td { padding:3px; }
  td input { width:100%; font-size:16px; padding:8px 6px; border:1px solid var(--line); border-radius:6px; min-width:0; }
  td.del button { padding:8px 10px; color:var(--warn); }
  .col-group { width:17%; } .col-room { width:17%; } .col-del { width:44px; }
  .msg { color:var(--warn); font-weight:600; margin-top:8px; }
  /* 라벨 미리보기: 엑셀 칸 모양(열 너비 45.6 : 행 높이 105pt ≈ 2.4 : 1) */
  .preview { display:grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(8, auto); border:1px solid #999; }
  .lbl { aspect-ratio: 2.4 / 1; border:1px dashed #bbb; display:flex; align-items:center; justify-content:center; text-align:center;
         white-space:pre-line; font-weight:900; line-height:1.25; font-size: clamp(11px, 3.6vw, 24px); padding:4px; overflow:hidden; }
  .lbl.empty { background:#fafafa; }
  .dl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .dl input { font-size:16px; padding:8px; border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body>
<main>
  <h1>🧳 샌딩백 조편성</h1>

  <!-- 1. 붙여넣기 입력 -->
  <section class="card">
    <h2>① 명단 붙여넣기</h2>
    <textarea id="paste" placeholder="한 줄에 한 방(조)씩&#10;김영수 이태진&#10;김진국,이도한&#10;조경희님외2인"></textarea>
    <p class="hint">한 줄 = 1조. <b>이름1 이름2</b> 또는 <b>이름1,이름2</b>. 줄 맨 앞에 "3조"처럼 적으면 그 조 이름을 그대로 씁니다.<br>
      "○○님외2인" 같은 자유 문구도 그대로 들어갑니다. 객실번호(예: 1203호)는 자동으로 빼고 객실칸에 넣어요.</p>
    <div class="row-btns">
      <button class="primary" id="btnApply">아래 표로 넣기</button>
      <button id="btnSample">예시 넣어보기</button>
    </div>
  </section>

  <!-- 2. 표로 확인/수정 -->
  <section class="card">
    <h2>② 조 확인 · 수정</h2>
    <table>
      <thead><tr><th class="col-group">조</th><th>이름1</th><th>이름2</th><th class="col-room">객실</th><th class="col-del"></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="row-btns">
      <button id="btnAdd">+ 조 추가</button>
      <button id="btnClear">전체 지우기</button>
    </div>
    <p class="hint">이름2를 비우면 이름1 칸 내용만 들어갑니다. 끝에 "님"이 없으면 자동으로 붙어요. 객실은 라벨에 안 나갑니다.</p>
  </section>

  <!-- 3. 미리보기 + 다운로드 -->
  <section class="card">
    <h2>③ 라벨 미리보기 (A열 → B열 순서)</h2>
    <div class="preview" id="preview"></div>
    <div id="msg" class="msg"></div>
    <div class="dl" style="margin-top:12px">
      <label>날짜 <input type="date" id="date"></label>
      <button class="primary" id="btnDownload">엑셀 내려받기</button>
    </div>
  </section>
</main>

const MAX_CELLS = 16; // A1~A8, B1~B8

const tbody = document.getElementById('tbody');

// ---- 표 한 줄 추가 ----
function addRow(d = {}) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="g" placeholder="자동"></td>
    <td><input class="n1"></td>
    <td><input class="n2"></td>
    <td><input class="room" placeholder="선택"></td>
    <td class="del"><button title="삭제">✕</button></td>`;
  tr.querySelector('.g').value = d.group || '';
  tr.querySelector('.n1').value = d.n1 || '';
  tr.querySelector('.n2').value = d.n2 || '';
  tr.querySelector('.room').value = d.room || '';
  tr.querySelector('.del button').onclick = () => { tr.remove(); render(); };
  tr.querySelectorAll('input').forEach(i => i.addEventListener('input', render));
  tbody.appendChild(tr);
}

// ---- 붙여넣기 한 줄 해석 ----
function parseLine(line) {
  let s = line.trim();
  if (!s) return null;
  let group = '';
  const gm = s.match(/^(\d+\s*조)\s*[:.)\-]?\s*/);         // 맨 앞 "3조"
  if (gm) { group = gm[1].replace(/\s/g, ''); s = s.slice(gm[0].length); }
  let room = '';
  const rm = s.match(/(?:^|[\s,])(\d{2,5}\s*호?)\s*$/);    // 맨 끝 객실번호
  if (rm) { room = rm[1].trim(); s = s.slice(0, rm.index).trim(); }
  const rm2 = s.match(/^(\d{2,5}\s*호)[\s,]+/);           // 맨 앞 "1203호"
  if (!room && rm2) { room = rm2[1].trim(); s = s.slice(rm2[0].length); }
  s = s.replace(/[,\s]+$/, '');
  let n1 = s, n2 = '';
  if (s.includes(',')) { const p = s.split(','); n1 = p[0].trim(); n2 = p.slice(1).join(',').trim(); }
  else { const p = s.split(/\s+/); if (p.length === 2) { n1 = p[0]; n2 = p[1]; } }
  return { group, n1, n2, room };
}

// ---- 표 → 조 목록 ----
function getGroups() {
  const out = [];
  [...tbody.rows].forEach(tr => {
    const n1 = tr.querySelector('.n1').value.trim();
    const n2 = tr.querySelector('.n2').value.trim();
    if (!n1 && !n2) return;
    let names = [n1, n2].filter(Boolean).join(',');
    if (!names.includes('님')) names += '님';
    const g = tr.querySelector('.g').value.trim() || ((out.length + 1) + '조');
    out.push(g + '\n' + names);
  });
  return out;
}

// ---- 미리보기 ----
function render() {
  // 비어 있는 조 칸에 자동 번호 표시
  let k = 0;
  [...tbody.rows].forEach(tr => {
    const has = tr.querySelector('.n1').value.trim() || tr.querySelector('.n2').value.trim();
    if (has) k++;
    tr.querySelector('.g').placeholder = has ? k + '조' : '자동';
  });
  const groups = getGroups();
  const pv = document.getElementById('preview');
  pv.innerHTML = '';
  for (let i = 0; i < MAX_CELLS; i++) {
    const d = document.createElement('div');
    d.className = 'lbl' + (groups[i] ? '' : ' empty');
    d.textContent = groups[i] || '';
    pv.appendChild(d);
  }
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnDownload');
  if (groups.length > MAX_CELLS) { msg.textContent = `조가 ${groups.length}개예요. 양식은 최대 ${MAX_CELLS}칸이라 ${MAX_CELLS}개 이하로 줄여주세요.`; btn.disabled = true; }
  else if (!groups.length) { msg.textContent = ''; btn.disabled = true; }
  else { msg.textContent = ''; btn.disabled = false; }
}

// ---- XML 특수문자 처리 ----
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- 엑셀 만들기: 템플릿을 열어 '샌딩백' 시트 글자만 교체 ----
async function buildXlsx(groups) {
  const zip = await JSZip.loadAsync(TEMPLATE_B64, { base64: true });

  // '샌딩백' 시트 파일 찾기
  const wb = await zip.file('xl/workbook.xml').async('string');
  const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const rid = wb.match(/<sheet [^>]*name="샌딩백"[^>]*r:id="([^"]+)"/)[1];
  const target = rels.match(new RegExp(`<Relationship [^>]*Id="${rid}"[^>]*Target="([^"]+)"`))
             || rels.match(new RegExp(`<Relationship [^>]*Target="([^"]+)"[^>]*Id="${rid}"`));
  const sheetPath = 'xl/' + target[1].replace(/^\/?xl\//, '');

  // 다른 시트가 쓰는 공유문자열 번호는 그대로 둠
  const used = new Set(); let usedRefs = 0;
  for (const f of Object.keys(zip.files)) {
    if (!/^xl\/worksheets\/[^/]+\.xml$/.test(f) || f === sheetPath) continue;
    const x = await zip.file(f).async('string');
    for (const m of x.matchAll(/<c [^>]*t="s"[^>]*>\s*<v>(\d+)<\/v>/g)) { used.add(+m[1]); usedRefs++; }
  }

  // sharedStrings: 샌딩백 시트 전용이던 옛 이름은 비우고, 새 조 이름을 뒤에 추가
  let sst = await zip.file('xl/sharedStrings.xml').async('string');
  let idx = 0;
  sst = sst.replace(/<si>[\s\S]*?<\/si>/g, m => (used.has(idx++) ? m : '<si><t></t></si>'));
  const base = idx;
  const add = groups.map(g => `<si><t xml:space="preserve">${esc(g)}</t></si>`).join('');
  sst = sst.replace('</sst>', add + '</sst>')
           .replace(/count="\d+"/, `count="${usedRefs + groups.length}"`)
           .replace(/uniqueCount="\d+"/, `uniqueCount="${base + groups.length}"`);
  zip.file('xl/sharedStrings.xml', sst);

  // 시트: 1~8행의 A·B칸을 새로 씀 (서식 9번 = 35pt, 가운데, 줄바꿈)
  let sh = await zip.file(sheetPath).async('string');
  const cell = (col, r, i) => groups[i] !== undefined
      ? `<c r="${col}${r}" s="9" t="s"><v>${base + i}</v></c>`
      : `<c r="${col}${r}" s="9"/>`;
  for (let r = 1; r <= 8; r++) {
    const re = new RegExp(`<row r="${r}"([^>]*?)(?:/>|>[\\s\\S]*?</row>)`);
    sh = sh.replace(re, (m, attrs) => `<row r="${r}"${attrs}>${cell('A', r, r - 1)}${cell('B', r, r + 7)}</row>`);
  }
  zip.file(sheetPath, sh);

  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE',
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ---- 버튼들 ----
document.getElementById('btnApply').onclick = () => {
  const rows = document.getElementById('paste').value.split(/\r?\n/).map(parseLine).filter(Boolean);
  if (!rows.length) return;
  tbody.innerHTML = '';
  rows.forEach(addRow);
  render();
};
document.getElementById('btnSample').onclick = () => {
  document.getElementById('paste').value =
    ['김영수 이태진','김진국 이도한','원성혁 이원휴','곽동원 박규성','박성재 정만영',
     '임종근 추용식','박진호 이상정','김일수 이태현','곽병욱 유정재','이의식 안상욱'].join('\n');
  document.getElementById('btnApply').click();
};
document.getElementById('btnAdd').onclick = () => { addRow(); render(); };
document.getElementById('btnClear').onclick = () => {
  if (!confirm('표의 내용을 모두 지울까요?')) return;
  tbody.innerHTML = ''; for (let i = 0; i < 3; i++) addRow(); render();
};
document.getElementById('btnDownload').onclick = async () => {
  const groups = getGroups();
  if (!groups.length || groups.length > MAX_CELLS) return;
  const blob = await buildXlsx(groups);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `샌딩백_${document.getElementById('date').value || 'date'}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

// 시작: 오늘 날짜(한국시간), 빈 줄 3개
(() => {
  const now = new Date(Date.now() + 9 * 3600e3);
  document.getElementById('date').value = now.toISOString().slice(0, 10);
  for (let i = 0; i < 3; i++) addRow();
  render();
})();
</script>
